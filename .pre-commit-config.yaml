---
# Managed by Pulumi (gitlab-permissions-as-code). Do not edit by hand.
# Hooks are declared in IaC; hand edits are reverted on the next apply.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
        exclude: '(^|/)(\.vscode/[^/]*\.json|[^/]*devcontainer\.json|[jt]sconfig[^/]*\.json)$'
      - id: check-toml
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
